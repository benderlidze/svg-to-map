<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<title>Map</title>
<style>
  :root{ --panel:rgba(21,27,35,.94); --line:#2a333f; --ink:#e6edf3; --dim:#8b98a5; --acc:#4aa3ff }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  #map{position:absolute;inset:0;background:#0d1117}

  #ui{
    position:absolute;top:12px;right:12px;z-index:5;width:200px;
    background:var(--panel);backdrop-filter:blur(8px);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;
    max-height:calc(100% - 24px);overflow:auto
  } 
  .lab{color:var(--dim);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
       display:flex;justify-content:space-between;align-items:baseline}
  .lab i{font-style:normal;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .seg button{
    background:#1d2632;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:7px 4px;font-size:12px;cursor:pointer}
  .seg button:hover{background:#26313f}
  .seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  input[type=range]{width:100%;accent-color:var(--acc)}
  select{width:100%;margin-top:6px;background:#0b1017;border:1px solid var(--line);border-radius:6px;
    color:var(--ink);padding:6px;font-size:12px}
  .layers{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto;margin-top:6px;
    background:#0b1017;border:1px solid var(--line);border-radius:6px;padding:5px}
  .layer{display:flex;align-items:center;gap:7px;padding:4px;border-radius:4px;cursor:pointer}
  .layer:hover{background:#151d27}.layer input{margin:0;accent-color:var(--acc)}
  .layer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--dim);padding:4px;font-size:11px}

  #msg{
    position:absolute;left:12px;bottom:28px;z-index:5;max-width:420px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);padding:10px 12px;display:none}
  #msg button{margin-top:8px;background:#1d2632;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>

<div id="ui">
  <div>
    <div class="lab">Base map</div>
    <div class="seg" style="margin-top:6px">
      <button data-b="sat" aria-pressed="true">Satellite</button>
      <button data-b="streets" aria-pressed="false">Streets</button>
      <button data-b="light" aria-pressed="false">Light</button>
      <button data-b="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
  <div>
    <div class="lab">Overlay <i id="vO">100%</i></div>
    <input type="range" id="o" min="0" max="100" value="100">
  </div>
  <div id="pictureUi" style="display:none">
    <div class="lab">Picture <i id="vPO">80%</i></div>
    <input type="range" id="pO" min="0" max="100" value="80">
    <button id="pictureToggle" aria-pressed="true" style="width:100%;margin-top:6px">Hide picture</button>
  </div>
  <div>
    <div class="lab">SVG layers <i id="layerCount">—</i></div>
    <div class="seg" style="margin-top:6px"><button id="layersAll">All</button><button id="layersNone">None</button></div>
    <div id="layers" class="layers"><div class="empty">Loading SVG…</div></div>
  </div>
  <div>
    <div class="lab">SVG quality <i id="renderInfo">4096 px</i></div>
    <select id="quality">
      <option value="2048">Normal · 2048 px</option>
      <option value="4096" selected>High · 4096 px</option>
      <option value="8192">Maximum · 8192 px</option>
    </select>
  </div>
</div>

<div id="msg">
  <div id="msgText"></div>
  <button id="pick">Choose SVG file</button>
  <input type="file" id="file" accept=".svg,image/svg+xml" hidden>
</div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs';

/* ---------- placement ---------- */
const SVG_URL = 'test.svg';
const P = {
  lng: -113.99607348716607,
  lat: 46.86704363356705,
  widthM: 385,
  rot: -0.6000000000000227,
  aspect: 1,
  opacity: 1,
  layers: {
    Detail_6_: true,
    A1: true,
    A2: true,
    Level_1: true,
    Level_2: true,
    Level_3: true,
    Level_4: true
  },
  rasterSize: 4096
};
const VIEW = { center: [-113.9955788352861, 46.86662945269106], zoom: 17.552524538129347, bearing: 0, pitch: 0 };
const PIC = {
  dataUrl:'image.png',
  lng:-113.9964393293445,
  lat:46.86674812733355,
  widthM:425,
  rot:-3.6000000000000227,
  opacity:.79,
  aspect:.7232267037552156,
  locked:true
};

/* ---------- base maps ---------- */
const RASTER = {
  sat:     { tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
             maxzoom:19, attribution:'Esri, Maxar, Earthstar Geographics' },
  streets: { tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
             maxzoom:19, attribution:'© OpenStreetMap contributors' },
  light:   { tiles:['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'],
             maxzoom:20, attribution:'© OpenStreetMap contributors, © CARTO' },
  dark:    { tiles:['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],
             maxzoom:20, attribution:'© OpenStreetMap contributors, © CARTO' }
};
const sources = {}, layers = [];
for(const [id, s] of Object.entries(RASTER)){
  sources[id] = { type:'raster', tileSize:256, ...s };
  layers.push({ id, type:'raster', source:id, layout:{ visibility: id === 'sat' ? 'visible' : 'none' } });
}

const map = new maplibregl.Map({
  container: 'map',
  style: { version:8, sources, layers },
  center: VIEW.center, zoom: VIEW.zoom, bearing: VIEW.bearing, pitch: VIEW.pitch,
  maxZoom: 22
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), 'top-left');
map.addControl(new maplibregl.ScaleControl({ maxWidth:120, unit:'metric' }), 'bottom-right');

/* ---------- overlay geometry ---------- */
function corners(p = P){
  const wm = p.widthM, hm = p.widthM * p.aspect;
  const th = p.rot * Math.PI/180, c = Math.cos(th), s = Math.sin(th);
  const mLat = 111320, mLng = 111320 * Math.cos(p.lat*Math.PI/180) || 1e-6;
  return [[-wm/2,hm/2],[wm/2,hm/2],[wm/2,-hm/2],[-wm/2,-hm/2]].map(([x,y])=>[
    p.lng + (x*c + y*s)/mLng,
    p.lat + (-x*s + y*c)/mLat
  ]);
}

/* ---------- picture under the SVG ---------- */
let pictureAdded = false, pictureVisible = true;
function showPicture(){
  map.addSource('picture', { type:'image', url:PIC.dataUrl, coordinates:corners(PIC) });
  map.addLayer({ id:'picture', type:'raster', source:'picture',
    paint:{ 'raster-opacity':PIC.opacity, 'raster-fade-duration':0, 'raster-resampling':'linear' } },
    map.getLayer('overlay') ? 'overlay' : undefined);
  pictureAdded = true;
  document.getElementById('pictureUi').style.display = 'block';
  document.getElementById('pO').value = Math.round(PIC.opacity * 100);
  document.getElementById('vPO').textContent = Math.round(PIC.opacity * 100) + '%';
}

/* ---------- SVG → raster ---------- */
function svgLayers(svg){
  const allGroups = [...svg.querySelectorAll('g')];
  const explicit = allGroups.filter(g => g.getAttribute('inkscape:groupmode') === 'layer');
  const groups = explicit.length ? explicit : [...svg.children].filter(el => el.localName === 'g' && el.id);
  return groups.map((el, i) => ({
    el,
    id: el.id || `layer-${i + 1}`,
    name: el.getAttribute('inkscape:label') || el.getAttribute('data-name') || el.id || `Layer ${i + 1}`,
    visible: el.getAttribute('display') !== 'none' && !/display\s*:\s*none/i.test(el.getAttribute('style') || '')
  }));
}
function paintLayers(defs){
  const box = document.getElementById('layers'); box.replaceChildren();
  document.getElementById('layerCount').textContent = defs.length ? `${defs.filter(d => P.layers[d.id]).length}/${defs.length}` : '0';
  if(!defs.length){ box.innerHTML = '<div class="empty">No separate layers found</div>'; return; }
  for(const d of defs){
    const label = document.createElement('label'); label.className = 'layer'; label.title = d.name;
    const input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!P.layers[d.id];
    const span = document.createElement('span'); span.textContent = d.name.replace(/_x26_/g, ' & ');
    input.onchange = () => { P.layers[d.id] = input.checked; rerenderOverlay(); };
    label.append(input, span); box.append(label);
  }
}
function maxTextureSize(){
  const gl = map.getCanvas().getContext('webgl2') || map.getCanvas().getContext('webgl');
  return gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 4096;
}
async function rasterize(text, preserveLayers){
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  if(doc.querySelector('parsererror')) throw new Error('The SVG file could not be parsed.');
  const svg = doc.documentElement;
  const defs = svgLayers(svg);
  const oldLayers = preserveLayers ? P.layers : {};
  P.layers = Object.fromEntries(defs.map(d => [d.id,
    Object.prototype.hasOwnProperty.call(oldLayers, d.id) ? !!oldLayers[d.id] : d.visible]));
  for(const d of defs){
    if(P.layers[d.id]){ d.el.removeAttribute('display'); d.el.style.removeProperty('display'); }
    else d.el.style.setProperty('display', 'none');
  }
  paintLayers(defs);
  const num = v => { const n = parseFloat(v); return (v && !/%$/.test(v.trim()) && isFinite(n) && n > 0) ? n : 0; };
  let w = num(svg.getAttribute('width')), h = num(svg.getAttribute('height'));
  const vb = (svg.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  if((!w || !h) && vb.length === 4 && vb[2] > 0 && vb[3] > 0){ w = vb[2]; h = vb[3]; }
  if(!w || !h){ w = 1024; h = 1024; }
  if(vb.length !== 4) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const target = Math.min(Number(P.rasterSize) || 4096, maxTextureSize());
  const k = Math.min(target/w, target/h);
  const renderW = Math.max(1, Math.round(w*k)), renderH = Math.max(1, Math.round(h*k));
  svg.setAttribute('width', renderW); svg.setAttribute('height', renderH);

  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  const img = new Image();
  await new Promise((ok, no) => {
    img.onload = ok;
    img.onerror = () => no(new Error('The SVG could not be rendered — external links or fonts inside the file usually cause this.'));
    img.src = url;
  });

  const cv = document.createElement('canvas');
  cv.width = renderW;
  cv.height = renderH;
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  document.getElementById('renderInfo').textContent = `${Math.max(cv.width, cv.height)} px`;
  return { url: cv.toDataURL('image/png'), aspect: h/w };
}

let added = false, currentSvgText = null, renderSeq = 0;
async function showOverlay(text, preserveLayers = false){
  const seq = ++renderSeq;
  currentSvgText = text;
  const { url, aspect } = await rasterize(text, preserveLayers);
  if(seq !== renderSeq) return;
  P.aspect = aspect;
  if(added){
    map.getSource('overlay').updateImage({ url, coordinates: corners() });
  } else {
    map.addSource('overlay', { type:'image', url, coordinates: corners() });
    map.addLayer({ id:'overlay', type:'raster', source:'overlay',
      paint:{ 'raster-opacity': P.opacity, 'raster-fade-duration': 0, 'raster-resampling':'linear' } });
    added = true;
  }
  hideMsg();
}
function rerenderOverlay(){
  if(currentSvgText) showOverlay(currentSvgText, true).catch(err => showMsg(err.message));
}

/* ---------- messages / manual file fallback ---------- */
const msg = document.getElementById('msg');
function showMsg(text){ document.getElementById('msgText').textContent = text; msg.style.display = 'block'; }
function hideMsg(){ msg.style.display = 'none'; }
document.getElementById('pick').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0];
  if(f) f.text().then(showOverlay).catch(err => showMsg(err.message));
};

/* ---------- controls ---------- */
document.querySelectorAll('[data-b]').forEach(b => {
  b.onclick = () => {
    for(const id of Object.keys(RASTER)) map.setLayoutProperty(id, 'visibility', id === b.dataset.b ? 'visible' : 'none');
    document.querySelectorAll('[data-b]').forEach(x => x.setAttribute('aria-pressed', x === b));
  };
});
document.getElementById('o').oninput = e => {
  P.opacity = +e.target.value / 100;
  document.getElementById('vO').textContent = e.target.value + '%';
  if(added) map.setPaintProperty('overlay', 'raster-opacity', P.opacity);
};
document.getElementById('pO').oninput = e => {
  PIC.opacity = +e.target.value / 100;
  document.getElementById('vPO').textContent = e.target.value + '%';
  if(pictureAdded) map.setPaintProperty('picture', 'raster-opacity', PIC.opacity);
};
document.getElementById('pictureToggle').onclick = e => {
  pictureVisible = !pictureVisible;
  map.setLayoutProperty('picture', 'visibility', pictureVisible ? 'visible' : 'none');
  e.currentTarget.setAttribute('aria-pressed', pictureVisible);
  e.currentTarget.textContent = pictureVisible ? 'Hide picture' : 'Show picture';
};
document.getElementById('quality').onchange = e => { P.rasterSize = +e.target.value; rerenderOverlay(); };
function setAllLayers(visible){
  for(const id of Object.keys(P.layers)) P.layers[id] = visible;
  rerenderOverlay();
}
document.getElementById('layersAll').onclick = () => setAllLayers(true);
document.getElementById('layersNone').onclick = () => setAllLayers(false);

/* ---------- start ---------- */
async function initialize(){
  showPicture();
  try {
    const res = await fetch(SVG_URL);
    if(!res.ok) throw new Error(`${SVG_URL} returned ${res.status}.`);
    await showOverlay(await res.text(), true);
  } catch(err){
    showMsg(`Could not load ${SVG_URL}: ${err.message} Put the file next to this page and serve it over http, or load it manually.`);
  }
}

if(map.isStyleLoaded()) initialize();
else map.once('style.load', initialize);
</script>
</body>
</html>
