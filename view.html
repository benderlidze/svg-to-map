<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Сама страница на GitHub Pages тоже кешируется; эти заголовки просят браузер перепроверять её. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="stylesheet" href="https://unpkg.com/mapbox-gl@3.29.0/dist/mapbox-gl.css">
<!-- Классическая (не-ESM) сборка: она сама грузит свой воркер через blob:, поэтому кросс-доменный
     Worker с unpkg.com у неё не падает — в отличие от чанкованной ESM-сборки (проверено). -->
<script src="https://unpkg.com/mapbox-gl@3.29.0/dist/mapbox-gl.js"></script>
<title>Levels Viewer</title>

<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --line:#2a333f; --ink:#e6edf3;
    --dim:#8b98a5; --acc:#ffb454; --acc2:#4aa3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
  #map{position:absolute;inset:0}
  .mapboxgl-canvas{outline:none}

  #levels{
    position:absolute;top:12px;right:12px;z-index:5;
    background:rgba(21,27,35,.94);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:10px;padding:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    display:flex;flex-direction:column;gap:6px;
  }
  #levels .lab{color:var(--dim);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:0 2px 2px}
  #levels button{
    background:#1d2632;border:1px solid var(--line);color:var(--ink);border-radius:6px;
    padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;min-width:64px}
  #levels button:hover{background:#26313f;border-color:#3b4855}
  #levels button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#1a1205}
  #levels button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}

  #base{
    position:absolute;top:12px;left:52px;z-index:5;display:flex;
    border:1px solid var(--line);border-radius:6px;overflow:hidden;
    background:rgba(21,27,35,.94);backdrop-filter:blur(8px)}
  #base button{background:transparent;border:0;color:var(--ink);padding:7px 12px;font-size:12px;cursor:pointer}
  #base button[aria-pressed=true]{background:var(--acc2);color:#04101f;font-weight:600}
  #base button:disabled{opacity:.5;cursor:not-allowed}

  #status{position:absolute;left:12px;bottom:26px;z-index:5;background:rgba(21,27,35,.9);
    border:1px solid var(--line);border-radius:6px;padding:6px 9px;color:var(--dim);
    font-family:ui-monospace,Menlo,monospace;font-size:11px}
  #status b{color:var(--acc);font-weight:600}

  #offset{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
    background:rgba(21,27,35,.9);border:1px solid var(--line);border-radius:6px;
    padding:6px 9px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;
    display:flex;align-items:center;gap:8px}
  #offset button{background:#1d2632;border:1px solid var(--line);color:var(--ink);
    border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer}
  #offset button:hover{background:#26313f}
  #status.err b{color:#ff9c9c}
</style>
</head>
<body>
<div id="map"></div>

<div id="base">
  <button id="bOSM" aria-pressed="false" disabled>Map</button>
  <button id="bSAT" aria-pressed="true" disabled>Satellite</button>
  <button id="bMBX" aria-pressed="false" disabled>Mapbox</button>
</div>

<div id="levels">
  <div class="lab">Level</div>
</div>

<div id="status"><b id="stText">loading…</b></div>
<div id="offset">
  <span id="offsetText">Δlng 0.0000000  Δlat 0.0000000  (0.00 m E, 0.00 m N)</span>
  <button id="offsetCopy" title="Скопировать {dLng, dLat} в буфер">Copy</button>
  <button id="offsetReset" title="Сбросить сдвиг">Reset</button>
</div>

<script>
// Классическая сборка объявляет глобальный mapboxgl (не ES-модуль). Имя не «Map» — так называется
// и штатная структура данных JS, а classic-скрипт (не модуль) объявляет const в общей глобальной
// области видимости: назови мы так же, ниже new Map() для levelData/levelError строила бы
// mapboxgl-карту вместо коллекции и падала с «container must be a String or HTMLElement».
const { Map: MapboxMap, NavigationControl, ScaleControl } = mapboxgl;
mapboxgl.accessToken = 'pk.eyJ1IjoiY2Jnb2luZGVlcCIsImEiOiJjbXQ3bW92d3QwN2JkMnhweGNlYmUwaTJrIn0.hkq_CzwB7t5jcg9LTandbw';

const $ = s => document.querySelector(s);

// Стиль подключён напрямую через Mapbox Studio — движок карты пришлось сменить с MapLibre на
// настоящий Mapbox GL JS: этот стиль — это ссылка-«импорт» на mapbox://styles/mapbox/standard
// (новый 3D-стиль Mapbox, механизм style-fragments из Mapbox GL JS v3), MapLibre такое не умеет
// вообще — у стиля 0 собственных слоёв и 0 источников, всё разрешается движком на лету.
const MAPBOX_STYLE_URL = 'mapbox://styles/cbgoindeep/cmt7sxv0l001c01ssf9rk7lpk';

// Этажи сверху вниз, как их принято перечислять в здании.
const LEVELS = [
  { id:'4',  title:'4',  files:['4th.geojson'] },
  { id:'3',  title:'3',  files:['3rd.geojson'] },
  { id:'2',  title:'2',  files:['2nd.geojson'] },
  { id:'1',  title:'1',  files:['1st.geojson'] },
  // A1/A2 — по два файла на этаж: сам уровень плюс отдельно нарисованная парковка того же этажа.
  { id:'a1', title:'A1', files:['a1.geojson', 'parking-a1.geojson'] },
  { id:'a2', title:'A2', files:['a2.geojson', 'parking-a2.geojson'] }
];
const DEFAULT_LEVEL = '1';

/* ---------- карта ---------- */
// Наш собственный растровый стиль (OSM/Satellite) — то, с чем страница стартует.
const RASTER_STYLE = {
  version: 8,
  glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
  sources: {
    osm: { type:'raster', tileSize:256,
      tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      attribution:'© OpenStreetMap' },
    sat: { type:'raster', tileSize:256, maxzoom:19,
      tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      attribution:'Esri, Maxar, Earthstar Geographics' }
  },
  layers: [
    { id:'osm', type:'raster', source:'osm', layout:{visibility:'none'} },
    { id:'sat', type:'raster', source:'sat' }
  ]
};

const map = new MapboxMap({
  container: 'map',
  style: RASTER_STYLE,
  center: [-113.99607348716607, 46.86704363356705], zoom: 17.5, maxZoom: 22
});
map.boxZoom.disable();
map.addControl(new NavigationControl({visualizePitch:true}), 'top-left');
map.addControl(new ScaleControl({maxWidth:120, unit:'metric'}), 'bottom-right');

// 'raster' — наш собственный стиль (OSM/Satellite слоями видимости), 'mbx' — стиль из Mapbox Studio.
// Между ними переключаемся через setStyle, а это полная замена стиля: все наши источники и слои
// (полигоны, подписи) исчезают и их нужно добавить заново после того, как новый стиль загрузится.
let styleKind = 'raster';
let base = 'sat';
let poolSize = 0;

$('#bOSM').onclick = () => setBase('osm');
$('#bSAT').onclick = () => setBase('sat');
$('#bMBX').onclick = () => setBase('mbx');

function syncBaseButtons(){
  $('#bOSM').setAttribute('aria-pressed', String(base === 'osm'));
  $('#bSAT').setAttribute('aria-pressed', String(base === 'sat'));
  $('#bMBX').setAttribute('aria-pressed', String(base === 'mbx'));
}
function applyRasterVisibility(){
  map.setLayoutProperty('osm', 'visibility', base === 'osm' ? 'visible' : 'none');
  map.setLayoutProperty('sat', 'visibility', base === 'sat' ? 'visible' : 'none');
}
function setBase(b){
  if(!ready || b === base) return;
  base = b;
  syncBaseButtons();
  if(b === 'mbx'){
    if(styleKind !== 'mbx'){
      styleKind = 'mbx';
      map.once('style.load', reattachOverlay);
      map.setStyle(MAPBOX_STYLE_URL);
    }
    return;
  }
  if(styleKind !== 'raster'){
    styleKind = 'raster';
    map.once('style.load', () => { reattachOverlay(); applyRasterVisibility(); });
    map.setStyle(JSON.parse(JSON.stringify(RASTER_STYLE)));   // копия — setStyle мутирует объект стиля
  } else {
    applyRasterVisibility();
  }
}
// После setStyle старый источник/слои пропадают вместе со старым стилем — пересобираем их
// и заливаем текущие данные заново. Камеру (зум/центр) Mapbox GL сохраняет сам, трогать не надо.
// Иконки маркеров (map.addImage) тоже стираются вместе со стилем — грузим их заново.
async function reattachOverlay(){
  resetHover();   // старые слои стёрты вместе со стилем — забываем подсвеченный индекс
  addLayers();
  buildLayerPool(poolSize);
  setData();
  await addMarkerImages();
  addMarkerLayer();
  setMarkersData();
}

/* ---------- отрисовка фигур: полигоны/линии/точки этажа ---------- */
const SOURCE_ID = 'shapes';
const LABELS_SOURCE_ID = 'labels';
const EMPTY_FC = { type:'FeatureCollection', features:[] };
// Обводку можно выключить у объекта — красим прозрачным, цвет при этом сохраняется в свойствах.
const OUTLINE_COLOR_EXPR = ['case',
  ['==', ['coalesce', ['get','outlineEnabled'], true], false], 'rgba(0,0,0,0)',
  ['coalesce', ['get','outlineColor'], '#000000']
];
const OUTLINE_WIDTH = 2;
// Текст масштабируется вместе с картой, иначе при отдалении комната сжимается, а подпись — нет.
// Шаг стопов в 8 зумов при отношении значений 256 даёт удвоение размера на каждый уровень зума.
// Размер зажат сверху: у Mapbox/MapLibre жёсткий лимит 255px на text-size, за ним подпись не рисуется.
const LABEL_REFERENCE_ZOOM = 18;
const MAX_TEXT_SIZE = 60;
const MIN_TEXT_SIZE = 6;
function zoomScaledSize(sizeExpr){
  const safe = ['max', MIN_TEXT_SIZE, ['min', MAX_TEXT_SIZE, sizeExpr]];
  return ['interpolate', ['exponential', 2], ['zoom'],
    LABEL_REFERENCE_ZOOM - 6, ['/', safe, 64],
    LABEL_REFERENCE_ZOOM + 2, ['*', safe, 4]
  ];
}

let collection = null;

// Mapbox GL JS запрашивает шрифты стека ПО ОТДЕЛЬНОСТИ (не одним файлом на весь стек, как
// MapLibre) — наш собственный источник шрифтов (demotiles.maplibre.org) хранит только объединённый
// файл «Open Sans Regular,Arial Unicode MS Regular» и падает 404 на запросах каждого шрифта
// поодиночке. У самого стиля Mapbox (mbx) свой источник шрифтов через api.mapbox.com — там как раз
// нужен родной стек Mapbox Standard, иначе не найдёт. Поэтому шрифт зависит от активной подложки.
const FONT_FOR_STYLE = { raster:['Noto Sans Regular'], mbx:['Open Sans Regular','Arial Unicode MS Regular'] };

function addLayers(){
  map.addSource(SOURCE_ID, { type:'geojson', data: EMPTY_FC });
  // Подписи — отдельный точечный источник (центр фигуры): точку нельзя разрезать границей
  // внутреннего тайла, поэтому overlap можно включить безопасно и подпись никогда не пропадёт.
  map.addSource(LABELS_SOURCE_ID, { type:'geojson', data: EMPTY_FC });

  map.addLayer({
    id:'shapes-label', type:'symbol', source:LABELS_SOURCE_ID,
    filter:['!=', ['coalesce', ['get','label'], ''], ''],
    layout:{
      'text-field':['coalesce', ['get','label'], ''],
      // coalesce обязан идти ДО to-number: to-number(null) даёт 0, а не null.
      'text-size':zoomScaledSize(['to-number', ['coalesce', ['get','textSize'], 28]]),
      'text-rotate':['to-number', ['coalesce', ['get','textAngle'], 0]],
      'text-rotation-alignment':'map',
      'text-allow-overlap':true,
      'text-ignore-placement':true,
      'text-font':FONT_FOR_STYLE[styleKind]
    },
    paint:{
      'text-color':'#ffffff',
      'text-halo-color':'#000000',
      'text-halo-width':1.2
    }
  });
}

// Слои создаются пулом на максимальное число объектов среди всех этажей (а не по одному на
// фигуру), потому что при каждом переключении этажа/подложки слои удалять и создавать заново
// заметно глазом — мигает. У каждого объекта своя пара слоёв, потому что слой в Mapbox/MapLibre
// рисует все свои фигуры одним проходом — в общем line-слое обводка нижнего объекта легла бы
// поверх заливки верхнего. Привязка «слой ↔ объект» идёт по __index: в источнике всегда лежит
// ровно один этаж, поэтому индекс однозначно адресует фигуру, а порядок слоёв повторяет порядок
// объектов в файле.
function buildLayerPool(size){
  for(let i = 0; i < size; i++){
    const filter = ['==', ['get','__index'], i];
    map.addLayer({ id:`shape-fill-${i}`, type:'fill', source:SOURCE_ID,
      filter:['all', filter, ['any', ['==', ['geometry-type'], 'Polygon'], ['==', ['geometry-type'], 'MultiPolygon']]],
      paint:{ 'fill-color':['coalesce', ['get','fillColor'], '#8f623f'], 'fill-opacity':1 } }, 'shapes-label');
    map.addLayer({ id:`shape-line-${i}`, type:'line', source:SOURCE_ID,
      filter:['all', filter, ['!=', ['geometry-type'], 'Point'], ['!=', ['geometry-type'], 'MultiPoint']],
      paint:{ 'line-color':OUTLINE_COLOR_EXPR, 'line-width':OUTLINE_WIDTH } }, 'shapes-label');
    map.addLayer({ id:`shape-point-${i}`, type:'circle', source:SOURCE_ID,
      filter:['all', filter, ['any', ['==', ['geometry-type'], 'Point'], ['==', ['geometry-type'], 'MultiPoint']]],
      paint:{
        'circle-color':['coalesce', ['get','fillColor'], '#8f623f'],
        'circle-radius':7,
        'circle-stroke-color':OUTLINE_COLOR_EXPR,
        'circle-stroke-width':OUTLINE_WIDTH
      } }, 'shapes-label');
  }
}

function flatBounds(geometry){
  const flat = geometry.coordinates.flat(Infinity);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for(let i = 0; i < flat.length; i += 2){
    minX = Math.min(minX, flat[i]);   maxX = Math.max(maxX, flat[i]);
    minY = Math.min(minY, flat[i+1]); maxY = Math.max(maxY, flat[i+1]);
  }
  return [minX, minY, maxX, maxY];
}
// Подпись привязана к собственной координате properties.labelPoint = [lng, lat].
// Раньше точка считалась на лету из геометрии, а ручная правка жила в text-offset (в ems) —
// из-за em-единиц смещение масштабировалось вместе с текстом и подпись «ездила» по зумам.
// Теперь положение подписи — обычная географическая точка, она стоит намертво на любом зуме.
// Фигурам без labelPoint (старые файлы) точка считается один раз как центр габаритов.
function labelAnchor(feature){
  const point = feature.properties?.labelPoint;
  if(Array.isArray(point) && point.length === 2 && isFinite(point[0]) && isFinite(point[1])) return point;
  const [minX, minY, maxX, maxY] = flatBounds(feature.geometry);
  return [(minX + maxX) / 2, (minY + maxY) / 2];
}
function labelPointsCollection(fc){
  return {
    type:'FeatureCollection',
    features:(fc?.features || [])
      .filter(f => f.properties.label)
      .map(f => ({
        type:'Feature',
        properties:{
          label:f.properties.label, textSize:f.properties.textSize,
          textAngle:f.properties.textAngle
        },
        geometry:{ type:'Point', coordinates:labelAnchor(f) }
      }))
  };
}
function fitToCollection(fc){
  if(!fc.features.length) return;
  let [minX, minY, maxX, maxY] = [Infinity, Infinity, -Infinity, -Infinity];
  for(const feature of fc.features){
    const [x1, y1, x2, y2] = flatBounds(feature.geometry);
    minX = Math.min(minX, x1); minY = Math.min(minY, y1);
    maxX = Math.max(maxX, x2); maxY = Math.max(maxY, y2);
  }
  if(isFinite(minX)) map.fitBounds([[minX, minY], [maxX, maxY]], { padding:60, duration:0, maxZoom:21 });
}
/* ---------- смещение всей геометрии стрелками ---------- */
// Только визуальный сдвиг для подбора поправки — оригинальные данные (levelData) не трогаем,
// поэтому смещение не накапливается криво при переключении этажей и его всегда можно сбросить.
// Долгота «сжата» относительно широты в cos(широты) раз — без поправки на это шаг вправо/влево
// на экране казался бы длиннее шага вверх/вниз на то же число градусов.
const METERS_PER_DEGREE_LAT = 111320;
let offset = { dLng: 0, dLat: 0 };
function translateCoordinates(node, dLng, dLat){
  if(typeof node[0] === 'number') return [node[0] + dLng, node[1] + dLat];
  return node.map(item => translateCoordinates(item, dLng, dLat));
}
function translateCollection(fc, dLng, dLat){
  if(!fc || (!dLng && !dLat)) return fc;
  return {
    type:'FeatureCollection',
    // labelPoint — самостоятельная координата подписи, её надо сдвигать вместе с геометрией,
    // иначе при подгонке плана подписи останутся на старом месте.
    features:fc.features.map(f => {
      const properties = Array.isArray(f.properties?.labelPoint)
        ? { ...f.properties, labelPoint:[f.properties.labelPoint[0] + dLng, f.properties.labelPoint[1] + dLat] }
        : f.properties;
      return { ...f, properties, geometry:{ ...f.geometry, coordinates:translateCoordinates(f.geometry.coordinates, dLng, dLat) } };
    })
  };
}
function updateOffsetReadout(){
  const metersLng = offset.dLng * METERS_PER_DEGREE_LAT * Math.cos(map.getCenter().lat * Math.PI / 180);
  const metersLat = offset.dLat * METERS_PER_DEGREE_LAT;
  $('#offsetText').textContent =
    `Δlng ${offset.dLng.toFixed(7)}  Δlat ${offset.dLat.toFixed(7)}  (${metersLng.toFixed(2)} m E, ${metersLat.toFixed(2)} m N)`;
}
function nudge(dx, dy, big){
  const meters = 0.05 * (big ? 10 : 1);   // 5 см за нажатие, 50 см с Shift
  const lat = map.getCenter().lat;
  offset.dLng += dx * meters / (METERS_PER_DEGREE_LAT * Math.cos(lat * Math.PI / 180));
  offset.dLat += dy * meters / METERS_PER_DEGREE_LAT;
  updateOffsetReadout();
  setData();
}
$('#offsetReset').onclick = () => { offset = { dLng:0, dLat:0 }; updateOffsetReadout(); setData(); };
$('#offsetCopy').onclick = async () => {
  const text = JSON.stringify(offset);
  try { await navigator.clipboard.writeText(text); }
  catch { console.warn('Буфер обмена недоступен, значение:', text); }
};

function setData(){
  const shifted = translateCollection(collection, offset.dLng, offset.dLat);
  map.getSource(SOURCE_ID)?.setData(shifted || EMPTY_FC);
  map.getSource(LABELS_SOURCE_ID)?.setData(labelPointsCollection(shifted));
}

/* ---------- маркеры (лифты/лестницы/санузлы) — только просмотр, свой файл markers.geojson ---------- */
const MARKER_TYPES = [
  { id:'elevator', file:'icons/elevator.png' },
  { id:'stairs',   file:'icons/stairs.png' },
  { id:'wc',       file:'icons/wc.png' }
];
const MARKERS_SOURCE_ID = 'markers';
const MARKER_MAX_SIZE_ZOOM = 18.6;
const MARKER_MAX_ICON_SIZE = 0.9;
const MARKER_ICON_SIZE_BY_ZOOM = [
  'interpolate', ['exponential', 2], ['zoom'],
  0, MARKER_MAX_ICON_SIZE / Math.pow(2, MARKER_MAX_SIZE_ZOOM),
  MARKER_MAX_SIZE_ZOOM, MARKER_MAX_ICON_SIZE,
  22, MARKER_MAX_ICON_SIZE
];
let markersCollection = { type:'FeatureCollection', features:[] };

function markersForActiveLevel(){
  return { type:'FeatureCollection', features: markersCollection.features.filter(f => f.properties.level === activeLevel) };
}
function setMarkersData(){
  map.getSource(MARKERS_SOURCE_ID)?.setData(markersForActiveLevel());
}
// map.addImage переживает только текущий стиль — после setStyle (смена подложки) иконки исчезают,
// поэтому эта функция вызывается заново и в reattachOverlay(), а не только один раз при старте.
function addMarkerImages(){
  return Promise.all(MARKER_TYPES.map(t => new Promise(resolve => {
    if(map.hasImage(t.id)) return resolve();
    map.loadImage(t.file, (err, image) => {
      if(err){ console.warn(`Не удалось загрузить иконку ${t.file}:`, err); resolve(); return; }
      if(!map.hasImage(t.id)) map.addImage(t.id, image);
      resolve();
    });
  })));
}
function addMarkerLayer(){
  map.addSource(MARKERS_SOURCE_ID, { type:'geojson', data: markersForActiveLevel() });
  map.addLayer({
    id:'markers-icons', type:'symbol', source:MARKERS_SOURCE_ID,
    layout:{ 'icon-image':['get','type'], 'icon-size':MARKER_ICON_SIZE_BY_ZOOM, 'icon-allow-overlap':true, 'icon-ignore-placement':true }
  });
}
async function loadMarkers(){
  try {
    const fc = await loadFile('markers.geojson');
    if(fc?.type === 'FeatureCollection') markersCollection = fc;
  } catch(err){
    console.warn('markers.geojson не найден — маркеры не показаны:', err.message);
  }
}

map.on('load', async () => {
  addLayers();
  await addMarkerImages();
  addMarkerLayer();
  await loadMarkers();
  preloadLevels();
});

/* ---------- переключение этажей ---------- */
const levelData = new Map();    // все этажи загружаются сразу при старте
const levelError = new Map();
let activeLevel = null;
let ready = false;

function setStatus(text, isError = false){
  $('#stText').textContent = text;
  $('#status').classList.toggle('err', isError);
}
function syncButtons(){
  for(const level of LEVELS){
    const button = $(`#level-${level.id}`);
    button.setAttribute('aria-pressed', String(level.id === activeLevel));
    button.disabled = !ready;
  }
  for(const id of ['#bOSM','#bSAT','#bMBX']) $(id).disabled = !ready;
}
// Переключение — только подмена данных источника. Зум и положение карты не трогаем:
// переключая этажи, пользователь смотрит на одно и то же место здания.
function selectLevel(id){
  const level = LEVELS.find(l => l.id === id);
  if(!ready || !level || id === activeLevel) return;
  activeLevel = id;
  syncButtons();
  setHover(null);
  collection = levelData.get(id) || null;
  setData();
  setMarkersData();
  if(collection) setStatus(`level ${level.title} · ${collection.features.length} objects`);
  else setStatus(`level ${level.title} · failed to load: ${levelError.get(id)}`, true);
}

// Уникальный на каждую загрузку страницы токен против кеша. GitHub Pages отдаёт .geojson
// с Cache-Control: max-age=600 и раздаёт их через CDN, поэтому после заливки новых файлов
// браузер ещё долго показывает старые (а у старых нет textSize — и подписи рисуются размером
// по умолчанию, то есть огромными). Параметр в URL пробивает и браузерный кеш, и кеш CDN,
// no-store дополнительно запрещает браузеру складывать ответ к себе.
const CACHE_BUST = Date.now();
async function loadFile(file){
  const response = await fetch(`${file}?v=${CACHE_BUST}`, { cache:'no-store' });
  if(!response.ok) throw new Error(`${file}: ${response.status} ${response.statusText}`);
  return response.json();
}
// Уровень может состоять из нескольких файлов (этаж + отдельно нарисованная парковка того же
// этажа) — грузим их все и склеиваем в один FeatureCollection, порядок файлов задаёт порядок
// отрисовки (следующий файл ложится поверх предыдущего).
async function loadLevel(level){
  const collections = await Promise.all(level.files.map(loadFile));
  const fc = { type:'FeatureCollection', features: collections.flatMap(c => c.features || []) };
  // __index задаёт и адрес слоя в пуле, и порядок отрисовки — как в исходном файле.
  fc.features.forEach((feature, index) => {
    if(!feature.properties) feature.properties = {};
    feature.properties.__index = index;
  });
  return fc;
}
async function preloadLevels(){
  setStatus(`loading ${LEVELS.length} levels…`);
  const results = await Promise.allSettled(LEVELS.map(loadLevel));
  let maxFeatures = 0;
  results.forEach((result, i) => {
    const level = LEVELS[i];
    if(result.status === 'fulfilled'){
      levelData.set(level.id, result.value);
      maxFeatures = Math.max(maxFeatures, result.value.features?.length || 0);
    } else {
      levelError.set(level.id, result.reason?.message || 'unknown error');
      console.warn(`Не удалось загрузить уровень ${level.id}:`, result.reason);
    }
  });
  poolSize = maxFeatures;
  buildLayerPool(poolSize);
  ready = true;
  const failed = LEVELS.filter(l => levelError.has(l.id));
  const start = LEVELS.find(l => l.id === DEFAULT_LEVEL && levelData.has(l.id))
    || LEVELS.find(l => levelData.has(l.id));
  if(!start){ setStatus('no levels could be loaded', true); syncButtons(); return; }
  selectLevel(start.id);
  fitToCollection(collection);   // подгоняем вид один раз на старте, дальше зум не трогаем
  if(failed.length) setStatus(`${$('#stText').textContent} · failed: ${failed.map(l => l.title).join(', ')}`, true);
}

const levelsBox = $('#levels');
for(const level of LEVELS){
  const button = document.createElement('button');
  button.id = `level-${level.id}`;
  button.textContent = level.title;
  button.setAttribute('aria-pressed', 'false');
  button.disabled = true;
  button.onclick = () => selectLevel(level.id);
  levelsBox.appendChild(button);
}
// Цифры и буквы на клавиатуре — быстрый переход между этажами, стрелки — сдвиг всей геометрии.
const ARROW_DELTA = { ArrowUp:[0,1], ArrowDown:[0,-1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
window.addEventListener('keydown', event => {
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
  const arrow = ARROW_DELTA[event.key];
  if(arrow){ event.preventDefault(); nudge(arrow[0], arrow[1], event.shiftKey); return; }
  const key = event.key.toLowerCase();
  if(['1','2','3','4'].includes(key)) selectLevel(key);
  else if(key === 'a') selectLevel(activeLevel === 'a1' ? 'a2' : 'a1');
});

/* ---------- кликабельные помещения: подсветка при наведении + переход по клику ---------- */
// Ссылки задаются по подписи (properties.label) — так связь «комната → страница» живёт в одном
// месте и не требует правки geojson. Ключи сравниваются без учёта регистра и лишних пробелов.
const ROOM_LINKS = {
  'lobby':          'https://google.com',
  'lounge':         'https://google.com',
  'resident patio': 'https://google.com'
};
const HOVER_FILL_COLOR = '#87cefa';   // светло-голубой
const DEFAULT_FILL_EXPR = ['coalesce', ['get','fillColor'], '#8f623f'];

function linkForFeature(feature){
  const label = feature?.properties?.label;
  if(typeof label !== 'string') return null;
  return ROOM_LINKS[label.trim().toLowerCase()] || null;
}

// Пул слоёв адресуется по __index, поэтому подсветка — это подмена fill-color ровно у одного
// слоя. feature-state здесь не подходит: у каждой фигуры свой слой, и общего слоя с состоянием нет.
let hoveredIndex = null;
// Слои пула переиспользуются между этажами и пересоздаются при смене подложки — в обоих случаях
// подсветку надо снять, иначе синева останется на чужой фигуре с тем же __index.
function resetHover(){ hoveredIndex = null; if(map.getCanvas()) map.getCanvas().style.cursor = ''; }
function setHover(index){
  if(hoveredIndex === index) return;
  if(hoveredIndex !== null && map.getLayer(`shape-fill-${hoveredIndex}`))
    map.setPaintProperty(`shape-fill-${hoveredIndex}`, 'fill-color', DEFAULT_FILL_EXPR);
  hoveredIndex = index;
  if(hoveredIndex !== null && map.getLayer(`shape-fill-${hoveredIndex}`))
    map.setPaintProperty(`shape-fill-${hoveredIndex}`, 'fill-color', HOVER_FILL_COLOR);
  map.getCanvas().style.cursor = hoveredIndex === null ? '' : 'pointer';
}

// Слоёв в пуле сотни, перечислять их в queryRenderedFeatures дорого — вместо этого запрашиваем
// всё под курсором и отбираем свои слои по имени.
function clickableAt(point){
  for(const feature of map.queryRenderedFeatures(point)){
    if(!/^shape-fill-\d+$/.test(feature.layer?.id || '')) continue;
    if(linkForFeature(feature)) return feature;
  }
  return null;
}

map.on('mousemove', event => {
  const feature = clickableAt(event.point);
  setHover(feature ? feature.properties.__index : null);
});
map.on('mouseout', () => setHover(null));
map.on('click', event => {
  const feature = clickableAt(event.point);
  const link = linkForFeature(feature);
  if(link) window.open(link, '_blank', 'noopener');
});
</script>
</body>
</html>
